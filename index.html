<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
  <meta property="og:title" content="N5 Japanese Quiz – Free, No Login" />
  <meta property="og:description"
    content="Simple touch-to-play multiple choice for N5 vocab. No ads, no stats, just practice." />
  <meta name="theme-color" content="#1e293b" />

  <link rel="manifest" href="/japanese-n5-quiz/manifest.json">
  <meta name="theme-color" content="#1e293b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="N5 Quiz">
  <link rel="apple-touch-icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' fill='%231e293b'/%3E%3Ctext x='96' y='120' font-family='system-ui' font-size='80' text-anchor='middle' fill='white'%3E日本語%3C/text%3E%3C/svg%3E">

  <title>Japanese N5 Quiz</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: #f2f4f8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      touch-action: manipulation;
    }

    .app {
      max-width: 540px;
      width: 100%;
      background: #ffffff;
      border-radius: 28px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
      padding: 24px 20px 32px;
      position: relative;
      overflow: hidden;
    }

    h1 {
      font-size: 26px;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 4px;
      letter-spacing: -0.3px;
    }

    .subhead {
      color: #64748b;
      font-size: 14px;
      margin-bottom: 18px;
    }

    /* ── global progress ── */
    .global-progress {
      background: #f8fafc;
      border: 1.5px solid #eef2f6;
      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 16px;
    }

    .gp-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 8px;
      gap: 8px;
    }

    .gp-label {
      font-size: 11px;
      font-weight: 700;
      color: #475569;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    .gp-count {
      font-size: 12px;
      color: #64748b;
      font-variant-numeric: tabular-nums;
      font-weight: 500;
    }

    .gp-bar {
      height: 8px;
      background: #eef2f6;
      border-radius: 4px;
      overflow: hidden;
    }

    .gp-fill {
      height: 100%;
      background: linear-gradient(90deg, #3b82f6, #22c55e);
      width: 0%;
      transition: width 0.4s ease;
      border-radius: 4px;
    }

    /* ── topic grid ── */
    .topic-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .topic-btn {
      position: relative;
      background: #f8fafc;
      border: 1.5px solid #e9edf2;
      border-radius: 16px;
      padding: 11px 12px 10px;
      cursor: pointer;
      text-align: left;
      transition: all 0.15s;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      display: flex;
      flex-direction: column;
    }

    .topic-btn:active {
      transform: scale(0.97);
      background: #eef2f6;
    }

    .topic-btn.done {
      background: #f0fdf4;
      border-color: #bbf7d0;
      cursor: default;
    }

    .topic-btn.done:active {
      transform: none;
      background: #f0fdf4;
    }

    .tb-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      min-height: 20px;
    }

    .tb-icon {
      font-size: 15px;
      line-height: 1;
    }

    .tb-reset {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 15px;
      color: #cbd5e1;
      padding: 2px 4px;
      border-radius: 6px;
      line-height: 1;
      -webkit-tap-highlight-color: transparent;
      transition: all 0.15s;
    }

    .tb-reset:hover {
      color: #ef4444;
      background: #fef2f2;
    }

    .tb-reset:active {
      transform: scale(0.85);
    }

    .tb-label {
      font-size: 13.5px;
      font-weight: 600;
      color: #1e293b;
      line-height: 1.25;
      margin-top: 2px;
    }

    .topic-btn.done .tb-label {
      color: #15803d;
    }

    .tb-count {
      font-size: 11px;
      color: #94a3b8;
      font-variant-numeric: tabular-nums;
      margin-top: 1px;
    }

    .topic-btn.done .tb-count {
      color: #22c55e;
      font-weight: 600;
    }

    .tb-bar {
      height: 4px;
      background: #eef2f6;
      border-radius: 2px;
      overflow: hidden;
      margin-top: 6px;
    }

    .tb-fill {
      height: 100%;
      background: linear-gradient(90deg, #3b82f6, #22c55e);
      width: 0%;
      transition: width 0.35s ease;
      border-radius: 2px;
    }

    .topic-btn.done .tb-fill {
      background: #22c55e;
    }

    /* ── quiz ── */
    .quiz-area {
      display: none;
      animation: fadeUp 0.3s ease;
    }

    .quiz-area.active {
      display: block;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(14px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .home-area.hidden {
      display: none;
    }

    .quiz-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      gap: 8px;
    }

    .back-btn {
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      padding: 4px 8px;
      color: #64748b;
      -webkit-tap-highlight-color: transparent;
    }

    .back-btn:active {
      transform: scale(0.9);
    }

    .topic-label {
      font-size: 13px;
      font-weight: 500;
      color: #475569;
      background: #f1f5f9;
      padding: 4px 14px;
      border-radius: 40px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 50%;
    }

    .romaji-toggle {
      background: #f1f5f9;
      border: none;
      font-size: 11px;
      font-weight: 600;
      color: #475569;
      padding: 6px 10px;
      border-radius: 20px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      white-space: nowrap;
    }

    .romaji-toggle.on {
      background: #dbeafe;
      color: #2563eb;
    }

    /* ── progress ── */
    .progress-track {
      height: 6px;
      background: #eef2f6;
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 10px;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #3b82f6, #22c55e);
      width: 0%;
      transition: width 0.3s ease;
    }

    /* ── score bar ── */
    .score-bar {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #64748b;
      margin-bottom: 14px;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
    }

    .score-bar .score-correct {
      color: #16a34a;
    }

    .score-bar .score-wrong {
      color: #dc2626;
    }

    /* ── word card ── */
    .word-card {
      position: relative;
      background: #f8fafc;
      border-radius: 24px;
      padding: 28px 20px 20px;
      text-align: center;
      margin-bottom: 16px;
      border: 1.5px solid #eef2f6;
      transition: background 0.25s, border-color 0.25s;
    }

    .word-card.mastered {
      background: #f0fdf4;
      border-color: #86efac;
    }

    .word-kanji {
      font-size: 52px;
      font-weight: 700;
      color: #0f172a;
      line-height: 1.15;
      letter-spacing: 1px;
      word-break: break-word;
    }

    .word-kana {
      font-size: 17px;
      color: #64748b;
      font-weight: 500;
      margin-top: 6px;
      min-height: 0;
    }

    .word-kana:empty {
      display: none;
    }

    .word-romaji {
      font-size: 15px;
      color: #94a3b8;
      font-weight: 500;
      margin-top: 3px;
      min-height: 20px;
      transition: opacity 0.2s;
    }

    .word-romaji.hidden {
      opacity: 0;
    }

    /* ── streak pips ── */
    .streak-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      margin-top: 16px;
    }

    .pips {
      display: flex;
      gap: 6px;
    }

    .pip {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #e2e8f0;
      transition: all 0.2s ease;
    }

    .pip.on {
      background: #3b82f6;
      transform: scale(1.12);
    }

    .pip.master {
      background: #22c55e;
      box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.18);
    }

    .streak-label {
      font-size: 11px;
      color: #94a3b8;
      font-weight: 600;
      letter-spacing: 0.2px;
    }

    .mastered-badge {
      display: none;
      position: absolute;
      top: 12px;
      right: 12px;
      background: #22c55e;
      color: #ffffff;
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 0.6px;
      padding: 4px 9px;
      border-radius: 20px;
      animation: pop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .mastered-badge.show {
      display: block;
    }

    @keyframes pop {
      from {
        transform: scale(0.5);
        opacity: 0;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    /* ── options ── */
    .options {
      display: flex;
      flex-direction: column;
      gap: 9px;
      margin-bottom: 16px;
    }

    .option {
      background: #ffffff;
      border: 2px solid #e9edf2;
      border-radius: 16px;
      padding: 15px 18px;
      font-size: 16px;
      font-weight: 500;
      color: #1e293b;
      cursor: pointer;
      text-align: left;
      transition: all 0.12s;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      position: relative;
    }

    .option:active {
      transform: scale(0.97);
    }

    .option .letter {
      display: inline-block;
      width: 24px;
      font-weight: 700;
      color: #94a3b8;
    }

    .option.correct {
      border-color: #22c55e;
      background: #f0fdf4;
      color: #15803d;
    }

    .option.correct .letter {
      color: #22c55e;
    }

    .option.wrong {
      border-color: #ef4444;
      background: #fef2f2;
      color: #dc2626;
    }

    .option.wrong .letter {
      color: #ef4444;
    }

    .option.disabled {
      pointer-events: none;
      opacity: 0.65;
    }

    .option.reveal-correct {
      border-color: #22c55e;
      background: #f0fdf4;
      color: #15803d;
      opacity: 1;
    }

    .option.reveal-correct .letter {
      color: #22c55e;
    }

    /* ── next / continue ── */
    .next-btn {
      width: 100%;
      background: #1e293b;
      border: none;
      border-radius: 16px;
      padding: 16px;
      font-size: 17px;
      font-weight: 600;
      color: #ffffff;
      cursor: pointer;
      transition: all 0.15s;
      -webkit-tap-highlight-color: transparent;
      opacity: 0;
      pointer-events: none;
      transform: scale(0.96);
    }

    .next-btn.show {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1);
    }

    .next-btn:active {
      transform: scale(0.96);
    }

    .next-btn.finish {
      background: #16a34a;
    }

    /* ── results ── */
    .results {
      display: none;
      animation: fadeUp 0.3s ease;
    }

    .results.active {
      display: block;
    }

    .results h2 {
      font-size: 24px;
      color: #1e293b;
      margin-bottom: 6px;
      text-align: center;
    }

    .results .big-score {
      font-size: 48px;
      font-weight: 700;
      color: #16a34a;
      margin: 16px 0 4px;
      text-align: center;
      line-height: 1;
    }

    .results .big-score .denom {
      font-size: 24px;
      color: #94a3b8;
    }

    .results .score-msg {
      text-align: center;
      color: #64748b;
      font-size: 14px;
      margin-bottom: 22px;
    }

    .session-summary {
      display: flex;
      gap: 10px;
      margin-bottom: 22px;
    }

    .summary-cell {
      flex: 1;
      background: #f8fafc;
      border: 1.5px solid #eef2f6;
      border-radius: 14px;
      padding: 12px 8px;
      text-align: center;
    }

    .summary-cell .num {
      font-size: 20px;
      font-weight: 700;
      color: #1e293b;
      line-height: 1.2;
      font-variant-numeric: tabular-nums;
    }

    .summary-cell .num.green {
      color: #16a34a;
    }

    .summary-cell .num.red {
      color: #dc2626;
    }

    .summary-cell .cap {
      font-size: 10.5px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
      margin-top: 3px;
    }

    .missed-list {
      margin-bottom: 20px;
      max-height: 240px;
      overflow-y: auto;
    }

    .missed-list .ml-title {
      font-size: 12px;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 8px;
    }

    .missed-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 11px 14px;
      background: #fef2f2;
      border-radius: 12px;
      margin-bottom: 7px;
      gap: 12px;
    }

    .missed-item .m-word {
      font-weight: 600;
      color: #1e293b;
      font-size: 16px;
    }

    .missed-item .m-romaji {
      font-size: 12px;
      color: #94a3b8;
    }

    .missed-item .m-english {
      font-size: 14px;
      color: #dc2626;
      font-weight: 500;
      text-align: right;
    }

    .results-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .results-actions button {
      flex: 1;
      min-width: 110px;
      padding: 14px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.12s;
    }

    .btn-primary {
      background: #1e293b;
      color: #ffffff;
    }

    .btn-secondary {
      background: #f1f5f9;
      color: #475569;
    }

    .btn-danger {
      background: #fef2f2;
      color: #dc2626;
    }

    .btn-primary:active,
    .btn-secondary:active,
    .btn-danger:active {
      transform: scale(0.97);
    }

    /* ── footer ── */
    .footer {
      margin-top: 20px;
      font-size: 12px;
      color: #94a3b8;
      text-align: center;
      line-height: 1.6;
    }

    .link-btn {
      background: none;
      border: none;
      color: #cbd5e1;
      font-size: 11.5px;
      cursor: pointer;
      text-decoration: underline;
      padding: 4px;
      -webkit-tap-highlight-color: transparent;
      font-family: inherit;
    }

    .link-btn:hover {
      color: #ef4444;
    }

    /* ── responsive ── */
    @media (max-width: 480px) {
      .app {
        padding: 16px 14px 24px;
      }

      h1 {
        font-size: 22px;
      }

      .word-kanji {
        font-size: 42px;
      }

      .option {
        font-size: 15px;
        padding: 13px 15px;
        border-radius: 13px;
      }

      .tb-label {
        font-size: 12.5px;
      }
    }

    @media (max-width: 360px) {
      .word-kanji {
        font-size: 34px;
      }

      .option {
        font-size: 14px;
        padding: 11px 13px;
      }

      .topic-grid {
        gap: 8px;
      }
    }

    a {
      color: #3b82f6;
      text-decoration: none;
    }
  </style>
</head>

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/japanese-n5-quiz/sw.js');
  }
</script>

<body>

  <div class="app">
    <!-- ===== HOME ===== -->
    <div class="home-area" id="homeArea">
      <h1>日本語 N5</h1>
      <div class="subhead">Accurate N5 vocabulary · Master every word, 3 correct in a row</div>

      <div class="global-progress">
        <div class="gp-top">
          <span class="gp-label">Overall mastery</span>
          <span class="gp-count" id="globalCount">0 / 0 · 0%</span>
        </div>
        <div class="gp-bar">
          <div class="gp-fill" id="globalFill"></div>
        </div>
      </div>

      <div class="topic-grid" id="topicGrid"></div>

      <div class="footer">
        Built by Charuth Thameesha · Verified N5 vocabulary
        <div style="margin-top:6px">
          <button class="link-btn" id="resetAllBtn">Reset all progress</button>
        </div>
      </div>
    </div>

    <!-- ===== QUIZ ===== -->
    <div class="quiz-area" id="quizArea">
      <div class="quiz-header">
        <button class="back-btn" id="backBtn" aria-label="Back">‹</button>
        <span class="topic-label" id="quizTopicLabel">Verbs</span>
        <button class="romaji-toggle on" id="romajiToggle">ローマ字 ON</button>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="score-bar">
        <span id="sessionStats">0 ✓ · 0 ✗</span>
        <span><span id="topicMastered">0</span> / <span id="topicTotal">0</span> mastered</span>
      </div>
      <div class="word-card" id="wordCard">
        <div class="mastered-badge" id="masteredBadge">✓ MASTERED</div>
        <div class="word-kanji" id="wordKanji">食べる</div>
        <div class="word-kana" id="wordKana"></div>
        <div class="word-romaji" id="wordRomaji">taberu</div>
        <div class="streak-row">
          <div class="pips" id="streakPips"></div>
          <span class="streak-label" id="streakLabel">0/3 in a row</span>
        </div>
      </div>
      <div class="options" id="optionsContainer"></div>
      <button class="next-btn" id="nextBtn">next →</button>
    </div>

    <!-- ===== RESULTS ===== -->
    <div class="results" id="resultsArea">
      <h2 id="resultsTitle">Topic complete!</h2>
      <div class="big-score" id="bigScore">0<span class="denom">/0</span></div>
      <div class="score-msg" id="scoreMsg"></div>

      <div class="session-summary">
        <div class="summary-cell">
          <div class="num green" id="sumCorrect">0</div>
          <div class="cap">Correct</div>
        </div>
        <div class="summary-cell">
          <div class="num red" id="sumWrong">0</div>
          <div class="cap">Wrong</div>
        </div>
        <div class="summary-cell">
          <div class="num" id="sumMastered">0</div>
          <div class="cap">Mastered</div>
        </div>
      </div>

      <div class="missed-list" id="missedList"></div>

      <div class="results-actions">
        <button class="btn-secondary" id="resultsHomeBtn">Topics</button>
        <button class="btn-primary" id="resultsRetryBtn">Continue</button>
      </div>
    </div>
  </div>

  <script>
    // ═════════════════════════════════════════════════════════════════════
    //  ACCURATE N5 VOCABULARY  (UNTOUCHED — the heart of the app)
    //  Each word appears ONCE. Topic tags determine which quizzes it shows in.
    //  Format: { kanji, kana, romaji, english, topics: [...] }
    //  - kanji omitted when the word is normally written in kana
    //  - kana is always the reading
    // ═════════════════════════════════════════════════════════════════════

    const WORDS = [
      // ── PEOPLE & PRONOUNS ──
      { kanji: "私", kana: "わたし", romaji: "watashi", english: "I / me", topics: ["people"] },
      { kanji: "僕", kana: "ぼく", romaji: "boku", english: "I (male)", topics: ["people"] },
      { kana: "あなた", romaji: "anata", english: "you", topics: ["people"] },
      { kanji: "彼", kana: "かれ", romaji: "kare", english: "he / boyfriend", topics: ["people"] },
      { kanji: "彼女", kana: "かのじょ", romaji: "kanojo", english: "she / girlfriend", topics: ["people"] },
      { kanji: "皆さん", kana: "みなさん", romaji: "minasan", english: "everyone", topics: ["people"] },
      { kanji: "人", kana: "ひと", romaji: "hito", english: "person", topics: ["people"] },
      { kanji: "方", kana: "かた", romaji: "kata", english: "person (polite)", topics: ["people"] },
      { kanji: "子供", kana: "こども", romaji: "kodomo", english: "child", topics: ["people", "family"] },
      { kanji: "男の子", kana: "おとこのこ", romaji: "otoko no ko", english: "boy", topics: ["people"] },

    const MASTER_STREAK = 3;                 // correct answers in a row to master a word
    const STORAGE_KEY = 'n5quiz.progress.v1';  // per-word streaks
    const SETTINGS_KEY = 'n5quiz.settings.v1'; // UI preferences

    // ═════════════════════════════════════════════════════════════════════
    //  WORD INDEX
    //  The dictionary itself is never mutated. We build a deduplicated
    //  index at runtime so duplicate entries (e.g. 外国人 listed twice)
    //  never break counts or streaks.
    // ═════════════════════════════════════════════════════════════════════

    function wid(w) {
      return (w.kanji || w.kana) + '|' + w.romaji;
    }

    const UNIQUE_WORDS = (() => {
      const seen = new Set();
      const out = [];
      for (const w of WORDS) {
        const id = wid(w);
        if (seen.has(id)) continue;
        seen.add(id);
        out.push(w);
      }
      return out;
    })();

    const TOPIC_INDEX = {};
    for (const key of Object.keys(TOPICS)) {
      TOPIC_INDEX[key] = key === 'mixed'
        ? UNIQUE_WORDS
        : UNIQUE_WORDS.filter(w => w.topics.includes(key));
    }

    const TOTAL_WORDS = UNIQUE_WORDS.length;

    // ═════════════════════════════════════════════════════════════════════
    //  PERSISTENCE
    // ═════════════════════════════════════════════════════════════════════

    let progress = {};
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) progress = JSON.parse(raw) || {};
    } catch (e) {
      progress = {};
    }

    let settings = { showRomaji: true };
    try {
      const raw = localStorage.getItem(SETTINGS_KEY);
      if (raw) Object.assign(settings, JSON.parse(raw));
    } catch (e) { /* ignore */ }

    function saveProgress() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
      } catch (e) { /* storage full / private mode — ignore */ }
    }

    function saveSettings() {
      try {
        localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
      } catch (e) { /* ignore */ }
    }

    function streakOf(word) {
      return progress[wid(word)] || 0;
    }

    function setStreakById(id, value) {
      if (value <= 0) delete progress[id];
      else progress[id] = Math.min(MASTER_STREAK, value);
      saveProgress();
    }

    function isMastered(word) {
      return streakOf(word) >= MASTER_STREAK;
    }

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function getDisplay(word) {
      return word.kanji || word.kana;
    }

    function masteredCount(pool) {
      let n = 0;
      for (const w of pool) if (isMastered(w)) n++;
      return n;
    }

    function globalMasteredCount() {
      return masteredCount(UNIQUE_WORDS);
    }

    // ═════════════════════════════════════════════════════════════════════
    //  HOME RENDERING
    // ═════════════════════════════════════════════════════════════════════

    function renderGlobalProgress() {
      const m = globalMasteredCount();
      const pct = TOTAL_WORDS ? (m / TOTAL_WORDS) * 100 : 0;
      globalCount.textContent = `${m.toLocaleString()} / ${TOTAL_WORDS.toLocaleString()} · ${pct.toFixed(1)}%`;
      globalFill.style.width = `${pct}%`;
    }

    function renderTopics() {
      topicGrid.innerHTML = '';

      for (const key of Object.keys(TOPICS)) {
        const meta = TOPICS[key];
        const pool = TOPIC_INDEX[key];
        if (pool.length < 4) continue; // too small for a quiz

        const done = masteredCount(pool);
        const total = pool.length;
        const pct = (done / total) * 100;
        const complete = done >= total;

        const tile = document.createElement('div');
        tile.className = 'topic-btn' + (complete ? ' done' : '');
        tile.dataset.topic = key;

        tile.innerHTML = `
          <div class="tb-top">
            <span class="tb-icon">${meta.icon}</span>
            ${done > 0 ? '<button class="tb-reset" title="Reset this topic" aria-label="Reset">↺</button>' : ''}
          </div>
          <div class="tb-label">${complete ? '✓ ' : ''}${meta.label}</div>
          <div class="tb-count">${done} / ${total}</div>
          <div class="tb-bar"><div class="tb-fill" style="width:${pct}%"></div></div>
        `;

        if (!complete) {
          tile.addEventListener('click', () => startQuiz(key));
        }

        const resetBtn = tile.querySelector('.tb-reset');
        if (resetBtn) {
          resetBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            resetTopic(key);
          });
        }

        topicGrid.appendChild(tile);
      }
    }

    // ═════════════════════════════════════════════════════════════════════
    //  RESET
    // ═════════════════════════════════════════════════════════════════════

    function resetTopic(topicKey) {
      const meta = TOPICS[topicKey];
      const pool = TOPIC_INDEX[topicKey];
      const done = masteredCount(pool);
      const msg = `Reset "${meta.label}"?\n\n` +
        `This clears the streak of all ${pool.length} words in this topic` +
        `${done ? ` (${done} currently mastered)` : ''}.\n\n` +
        `Words shared with other topics will also lose their streak. This cannot be undone.`;
      if (!confirm(msg)) return;

      for (const w of pool) delete progress[wid(w)];
      saveProgress();
      renderTopics();
      renderGlobalProgress();
    }

    function resetAllProgress() {
      const m = globalMasteredCount();
      if (!confirm(`Reset ALL progress?\n\nThis clears the streak of every word (${m} mastered).\n\nThis cannot be undone.`)) return;
      progress = {};
      saveProgress();
      renderTopics();
      renderGlobalProgress();
    }

    // ═════════════════════════════════════════════════════════════════════
    //  QUIZ LIFECYCLE
    // ═════════════════════════════════════════════════════════════════════

    function startQuiz(topicKey) {
      const pool = TOPIC_INDEX[topicKey];
      const remaining = pool.filter(w => !isMastered(w));
      if (remaining.length === 0) return; // nothing left to do

      state.topic = topicKey;
      state.pool = pool;
      state.currentWord = null;
      state.options = [];
      state.answered = false;
      state.finished = false;
      state.questionNo = 0;
      state.prevId = null;
      state.reask = [];
      state.sessionCorrect = 0;
      state.sessionWrong = 0;
      state.sessionMastered = 0;
      state.missed = [];

      quizTopicLabel.textContent = TOPICS[topicKey].label;

      homeArea.classList.add('hidden');
      resultsArea.classList.remove('active');
      quizArea.classList.add('active');
      nextBtn.classList.remove('show');
      nextBtn.classList.remove('finish');

      updateSessionStats();
      updateQuizProgress();
      showQuestion();
    }

    // ── weighted draw with a short-term re-ask queue ──
    function drawWord(available) {
      // 1. A word we recently missed and that is now due comes first.
      const due = state.reask.filter(r => r.dueAt <= state.questionNo);
      if (due.length) {
        due.sort((a, b) => a.dueAt - b.dueAt);
        const pick = due.find(r => r.id !== state.prevId) || due[0];
        state.reask = state.reask.filter(r => r.id !== pick.id);
        const w = available.find(x => wid(x) === pick.id);
        if (w) return w;
      }

      // 2. Otherwise weighted random — low streaks are far more likely.
      let cands = available;
      if (available.length > 1) {
        const filtered = available.filter(w => wid(w) !== state.prevId);
        if (filtered.length) cands = filtered;
      }

      const weights = cands.map(w => (MASTER_STREAK + 1) - streakOf(w));
      const total = weights.reduce((a, b) => a + b, 0);
      let r = Math.random() * total;
      for (let i = 0; i < cands.length; i++) {
        r -= weights[i];
        if (r <= 0) return cands[i];
      }
      return cands[cands.length - 1];
    }

    function showQuestion() {
      const available = state.pool.filter(w => !isMastered(w));
      if (available.length === 0) {
        endSession();
        return;
      }

      state.questionNo++;
      const word = drawWord(available);
      state.currentWord = word;
      state.prevId = wid(word);
      state.answered = false;

      // Build the option set from the entire topic pool so distractors stay
      // plausible even when only a few words remain unmastered.
      const usedEnglish = new Set([word.english]);
      const candidatePool = state.pool.filter(w =>
        wid(w) !== wid(word) &&
        w.english !== word.english &&
        w.romaji !== word.romaji
      );
      const distractors = [];
      for (const w of shuffle(candidatePool)) {
        if (distractors.length >= 3) break;
        if (usedEnglish.has(w.english)) continue;
        usedEnglish.add(w.english);
        distractors.push(w);
      }

      const opts = shuffle([
        { english: word.english, correct: true },
        ...distractors.map(w => ({ english: w.english, correct: false })),
      ]);
      state.options = opts;

      // Word card
      wordKanji.textContent = getDisplay(word);
      wordKana.textContent = word.kanji ? word.kana : '';
      wordRomaji.textContent = word.romaji;
      wordRomaji.classList.toggle('hidden', !state.showRomaji);
      wordCard.classList.remove('mastered');
      masteredBadge.classList.remove('show');
      renderPips(word);

      // Options
      optionsContainer.innerHTML = '';
      const letters = ['A', 'B', 'C', 'D'];
      opts.forEach((opt, i) => {
        const div = document.createElement('div');
        div.className = 'option';
        div.innerHTML = `<span class="letter">${letters[i]}.</span>${opt.english}`;
        div.addEventListener('click', () => handleAnswer(i));
        optionsContainer.appendChild(div);
      });

      nextBtn.classList.remove('show');
      nextBtn.classList.remove('finish');
      nextBtn.textContent = 'next →';

      updateQuizProgress();
    }

    function renderPips(word) {
      const s = streakOf(word);
      streakPips.innerHTML = '';
      for (let i = 0; i < MASTER_STREAK; i++) {
        const p = document.createElement('span');
        let cls = 'pip';
        if (i < s) cls += s >= MASTER_STREAK ? ' master' : ' on';
        p.className = cls;
        streakPips.appendChild(p);
      }
      streakLabel.textContent = s >= MASTER_STREAK
        ? 'mastered'
        : `${s}/${MASTER_STREAK} in a row`;
    }

    function handleAnswer(selectedIdx) {
      if (state.answered) return;
      state.answered = true;

      const word = state.currentWord;
      const id = wid(word);
      const selected = state.options[selectedIdx];
      const correctIdx = state.options.findIndex(o => o.correct);
      const optionEls = optionsContainer.querySelectorAll('.option');

      optionEls.forEach(el => el.classList.add('disabled'));

      let masteredNow = false;

      if (selected.correct) {
        state.sessionCorrect++;
        optionEls[selectedIdx].classList.add('correct');

        const next = Math.min(MASTER_STREAK, streakOf(word) + 1);
        setStreakById(id, next);

        if (next >= MASTER_STREAK) {
          masteredNow = true;
          state.sessionMastered++;
          // It is mastered now — cancel any pending re-ask.
          state.reask = state.reask.filter(r => r.id !== id);
        }
      } else {
        state.sessionWrong++;
        optionEls[selectedIdx].classList.add('wrong');
        optionEls[correctIdx].classList.add('reveal-correct');
        setStreakById(id, 0);
        state.missed.push(word);

        // Schedule this word to come back after a few intervening questions.
        state.reask = state.reask.filter(r => r.id !== id);
        state.reask.push({
          id,
          dueAt: state.questionNo + 3 + Math.floor(Math.random() * 3),
        });
      }

      // Refresh pips to show the new streak.
      renderPips(word);

      if (masteredNow) {
        wordCard.classList.add('mastered');
        masteredBadge.classList.add('show');
        streakLabel.textContent = 'mastered';
      }

      updateSessionStats();
      updateQuizProgress();

      // Has the whole topic been cleared?
      const remaining = state.pool.filter(w => !isMastered(w)).length;
      state.finished = remaining === 0;

      nextBtn.textContent = state.finished ? 'finish →' : 'next →';
      nextBtn.classList.toggle('finish', state.finished);
      nextBtn.classList.add('show');
    }

    function nextQuestion() {
      if (state.finished) {
        endSession();
        return;
      }
      showQuestion();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function updateSessionStats() {
      sessionStats.innerHTML =
        `<span class="score-correct">${state.sessionCorrect}</span> ✓ · ` +
        `<span class="score-wrong">${state.sessionWrong}</span> ✗`;
    }

    function updateQuizProgress() {
      const total = state.pool.length;
      const done = masteredCount(state.pool);
      progressFill.style.width = `${total ? (done / total) * 100 : 0}%`;
      topicMasteredEl.textContent = done;
      topicTotalEl.textContent = total;
    }

    // ═════════════════════════════════════════════════════════════════════
    //  RESULTS
    // ═════════════════════════════════════════════════════════════════════

    function endSession() {
      quizArea.classList.remove('active');
      resultsArea.classList.add('active');

      const total = state.pool.length;
      const done = masteredCount(state.pool);
      const pct = Math.round((done / total) * 100);

      bigScore.innerHTML = `${done}<span class="denom">/${total}</span>`;
      resultsTitle.textContent = `${TOPICS[state.topic].icon} ${TOPICS[state.topic].label} complete!`;
      scoreMsg.textContent = `You mastered all ${total} words in this topic. 素晴らしい！`;

      sumCorrect.textContent = state.sessionCorrect;
      sumWrong.textContent = state.sessionWrong;
      sumMastered.textContent = state.sessionMastered;

      if (state.missed.length === 0) {
        missedList.innerHTML =
          '<div style="text-align:center;color:#16a34a;font-weight:600;padding:16px;">No mistakes in this session — well done! 🎉</div>';
      } else {
        // De-duplicate the review list.
        const seen = new Set();
        const unique = [];
        for (const w of state.missed) {
          const id = wid(w);
          if (seen.has(id)) continue;
          seen.add(id);
          unique.push(w);
        }
        missedList.innerHTML = `<div class="ml-title">Words you missed (${unique.length})</div>` +
          unique.map(w => `
            <div class="missed-item">
              <div>
                <div class="m-word">${getDisplay(w)}</div>
                <div class="m-romaji">${w.romaji}</div>
              </div>
              <div class="m-english">${w.english}</div>
            </div>
          `).join('');
      }

      resultsRetryBtn.textContent = 'Reset & replay';
      resultsRetryBtn.onclick = () => {
        resetTopic(state.topic);
        startQuiz(state.topic);
      };
      resultsHomeBtn.onclick = goHome;

      renderTopics();
      renderGlobalProgress();
    }

    // ═════════════════════════════════════════════════════════════════════
    //  NAVIGATION
    // ═════════════════════════════════════════════════════════════════════

    function goHome() {
      quizArea.classList.remove('active');
      resultsArea.classList.remove('active');
      homeArea.classList.remove('hidden');
      nextBtn.classList.remove('show');
      renderTopics();
      renderGlobalProgress();
    }

    // ═════════════════════════════════════════════════════════════════════
    //  ROMAJI TOGGLE
    // ═════════════════════════════════════════════════════════════════════

    function applyRomajiToggle() {
      wordRomaji.classList.toggle('hidden', !state.showRomaji);
      romajiToggle.textContent = state.showRomaji ? 'ローマ字 ON' : 'ローマ字 OFF';
      romajiToggle.classList.toggle('on', state.showRomaji);
    }

    romajiToggle.addEventListener('click', () => {
      state.showRomaji = !state.showRomaji;
      settings.showRomaji = state.showRomaji;
      saveSettings();
      applyRomajiToggle();
    });

    // ═════════════════════════════════════════════════════════════════════
    //  EVENT LISTENERS
    // ═════════════════════════════════════════════════════════════════════

    nextBtn.addEventListener('click', nextQuestion);
    backBtn.addEventListener('click', goHome);
    resetAllBtn.addEventListener('click', resetAllProgress);

    document.addEventListener('keydown', (e) => {
      if (!quizArea.classList.contains('active')) return;
      if (e.key === 'Escape') { goHome(); return; }

      if (!state.answered) {
        const n = parseInt(e.key, 10);
        if (n >= 1 && n <= 4) {
          const els = optionsContainer.querySelectorAll('.option');
          if (els[n - 1] && !els[n - 1].classList.contains('disabled')) els[n - 1].click();
        }
      } else if (e.key === 'Enter' && nextBtn.classList.contains('show')) {
        nextBtn.click();
      }
    });

    // ═════════════════════════════════════════════════════════════════════
    //  INIT
    // ═════════════════════════════════════════════════════════════════════

    applyRomajiToggle();
    renderTopics();
    renderGlobalProgress();

    console.log(
      `📚 ${TOTAL_WORDS} unique words (from ${WORDS.length} entries) · ` +
      `${Object.keys(TOPICS).length} topics · mastery at ${MASTER_STREAK} in a row`
    );
  </script>
</body>
